<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Contact | SF</title>
    <link rel="icon" type="image/png" href="images/Logos.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div style="font-weight:800; color:var(--primary);">SF.DESIGN</div>
            <div class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="about.html">Parcours</a>
                <a href="projects.html">Projets</a>
                <a href="video.html">Vidéo</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>
    <main>
        <h1>RESTONS EN CONTACT</h1>
        <section>
            <div class="contact-container">
                <div class="contact-info">
                    <h2>Mes Coordonnées</h2>
                    <div class="info-item">
                        <img src="./images/mail (1).jpg" alt="Email">
                        <p>souleymanefaye667@gmail.com</p>
                    </div>
                    <div class="info-item">
                        <img src="./images/phone.jpg" alt="Téléphone">
                        <p>+221 78 541 44 14</p>
                    </div>
                    <div class="info-item">
                        <img src="./images/insta.jpg" alt="Instagram">
                        <p>@souleymane_faye_</p>
                    </div>
                    <div class="info-item">
                        <img src="./images/th.jpg" alt="tiktok">
                        <p>@theyluv_souley</p>
                    </div>
                    <div class="info-item">
                        <img src="./images/snap.jpg" alt="snapchat">
                        <p>@sfaye4304</p>
                    </div>
                    <div class="info-item">
                        <img src="./images/linkedin.jpg" alt="linkedin">
                        <p>@ souleymane Faye</p>
                    </div>
                </div>
                <form>
                    <div class="form-group"><input type="text" placeholder="Votre nom complet"></div>
                    <div class="form-group"><input type="email" placeholder="Votre adresse mail" required></div>
                    <div class="form-group"><textarea rows="4" placeholder="Votre message"></textarea></div>
                    <button type="submit">ENVOYER</button>
                </form>
            </div>
        </section>
        <section class="card request-container">
            <h2 class="form-title">🚀 Me confier un projet</h2>
            <form class="project-form">
                <div class="input-group">
                    <label for="service">Type de service recherché :</label>
                    <select id="service" name="service" required>
                        <option value="web">Développement Web (HTML/CSS)</option>
                        <option value="app">Application Desktop (Java/Python)</option>
                        <option value="arduino">Système Embarqué (Arduino)</option>
                        <option value="design">Design Graphique</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="besoin">Décrivez votre besoin :</label>
                    <textarea id="besoin" name="besoin" rows="4" required
                        placeholder="Ex: Je veux un site pour ma boutique..."></textarea>
                </div>

                <div class="input-group">
                    <label for="deadline">Délai souhaité :</label>
                    <input type="date" id="deadline" name="deadline">
                </div>

                <button type="submit" class="submit-button">Envoyer la demande</button>
            </form>
        </section>
    </main>
    <footer>© 2026 SOULEYMANE FAYE</footer>
</body>

</html>
